# Automatyczne budowanie APK na serwerach GitHuba.
# Po każdej zmianie w repozytorium (albo ręcznie: Actions → Zbuduj APK → Run workflow)
# powstaje nowe wydanie w zakładce „Releases” z plikiem SkanerPDF.apk do pobrania.
name: Zbuduj APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Zainstaluj Javę 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zbuduj APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SkanerPDF.apk

      - name: Zapisz APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: SkanerPDF-apk
          path: SkanerPDF.apk

      - name: Opublikuj wydanie z APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wersja-${{ github.run_number }}
          name: Skaner PDF – wersja ${{ github.run_number }}
          body: |
            Plik do instalacji na telefonie: **SkanerPDF.apk** (poniżej, w sekcji Assets).
            Otwórz tę stronę na telefonie, stuknij plik i zainstaluj.
          files: SkanerPDF.apk
          make_latest: true
