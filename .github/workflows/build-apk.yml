# Automatyczne budowanie APK na serwerach GitHuba.
# Po każdej zmianie w repozytorium (albo ręcznie: Actions → Zbuduj APK → Run workflow)
# powstaje nowe wydanie w zakładce „Releases” z plikiem SkanerPDF.apk do pobrania.
name: Zbuduj APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v5

      - name: Sprawdź, czy przesłano wszystkie pliki
        run: |
          brak=0
          for p in app/build.gradle.kts app/src/main/AndroidManifest.xml settings.gradle.kts; do
            if [ ! -f "$p" ]; then echo "::error::Brak pliku $p – prześlij folder 'app' (Add file → Upload files, przeciągnij foldery)."; brak=1; fi
          done
          exit $brak

      - name: Zainstaluj Javę 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Przygotuj Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Zbuduj APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk SkanerPDF.apk

      - name: Opublikuj wydanie z APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "wersja-${{ github.run_number }}" SkanerPDF.apk \
            --title "Skaner PDF – wersja ${{ github.run_number }}" \
            --notes "Plik do instalacji: SkanerPDF.apk (sekcja Assets). Otwórz tę stronę na telefonie, stuknij plik i zainstaluj." \
            --latest
